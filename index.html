  <!-- Critical CSS for instant first paint.
       Sized to cover the dark hero shell so the first paint is never an
       unstyled flash. The full Tailwind bundle loads async via Vite. -->

    * { box-sizing: border-box; margin: 0; padding: 0 }

    html { scroll-behavior: smooth }

    body {
      background: #0a0a2e;
      font-family: Inter, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      color: #fff;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      text-rendering: optimizeLegibility;
    }

    #app { min-height: 100vh }

    /* Hero shell so it never looks broken during the JS load window. */
    #home { padding-top: 7rem; padding-bottom: 5rem; }
    @media (min-width: 640px) {
      #home { padding-top: 9rem; padding-bottom: 6rem; }
    }
    #home h1 {
      color: #fff;
      font-weight: 800;
      letter-spacing: -0.025em;
      line-height: 1.1;
      font-size: 1.875rem;
      max-width: 80rem;
      margin: 1.5rem auto 0;
      padding: 0 1.5rem;
    }
    @media (min-width: 640px) { #home h1 { font-size: 3rem; } }
    @media (min-width: 1024px) { #home h1 { font-size: 3.75rem; } }

    /* Anchor for any in-page scroll target so smooth-scroll doesn't fight. */

  </style>
